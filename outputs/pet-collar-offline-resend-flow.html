<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寵物項圈離線補送流程圖</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b85450'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee9df;color:#282722;font-family:Geist,"Noto Sans TC",sans-serif}body{display:grid;place-items:center;padding:24px}.sheet{width:min(1280px,calc(100vw - 48px),calc((100vh - 48px)*16/9));aspect-ratio:16/9;background:#f7f3ea;border:1px solid #cfc6b6;box-shadow:0 18px 50px rgba(50,43,32,.13);overflow:hidden}svg{width:100%;height:100%;display:block}.title{font:700 38px Fraunces,serif;fill:#282722}.kicker{font-size:12px;font-weight:700;letter-spacing:2.4px;fill:#b85450}.subtitle{font-size:15px;fill:#6d665b}.node{fill:#fffdf8;stroke:#80786b;stroke-width:1.4}.node-accent{fill:#fbefeb;stroke:#b85450;stroke-width:2}.store{fill:#f0eee6;stroke:#477c74;stroke-width:1.5}.decision{fill:#fffaf0;stroke:#a47f42;stroke-width:1.5}.nt{font-size:14px;font-weight:700;fill:#282722}.ns{font-size:10px;fill:#6d665b}.arrow{fill:none;stroke:#555149;stroke-width:1.6}.accent{stroke:#b85450;stroke-width:2}.queue{stroke:#477c74;stroke-width:1.7}.lab{font-size:10px;font-weight:700;fill:#555149}.yes{fill:#477c74}.no{fill:#b85450}.callout{fill:#fff8e8;stroke:#c7a960}.callout-t{font-size:11px;fill:#554c3b}.small{font-size:9px;fill:#7e766a}
</style></head><body><main class="sheet" aria-label="寵物項圈離線補送流程圖"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="offline-title offline-desc"><title id="offline-title">寵物項圈離線補送流程圖</title><desc id="offline-desc">辨識事件加入唯一識別碼後，依序補送 SQLite 佇列，只有收到後端確認才刪除，後端以 clientEventId 去重。</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".8" fill="#282722" opacity=".08"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#555149"/></marker><marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b85450"/></marker><marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#477c74"/></marker></defs><rect width="1280" height="720" fill="#f7f3ea"/><rect width="1280" height="720" fill="url(#dots)"/><text x="54" y="48" class="kicker">SMART PET COLLAR · DELIVERY SAFETY</text><text x="54" y="92" class="title">離線事件如何安全補送</text><text x="54" y="119" class="subtitle">FIFO 順序、收到 ACK 才刪除、後端以 clientEventId 冪等去重，三層一起避免遺失與重複。</text>
<rect x="84" y="170" width="190" height="64" rx="32" class="node-accent"/><text x="179" y="197" text-anchor="middle" class="nt">新辨識事件</text><text x="179" y="216" text-anchor="middle" class="ns">建立 payload</text>
<rect x="348" y="170" width="220" height="64" rx="8" class="node"/><text x="458" y="197" text-anchor="middle" class="nt">附加 clientEventId</text><text x="458" y="216" text-anchor="middle" class="ns">跨重試保持同一識別碼</text>
<path d="M692 160L804 218L692 276L580 218Z" class="decision"/><text x="692" y="214" text-anchor="middle" class="nt">有舊事件待補送？</text><text x="692" y="233" text-anchor="middle" class="ns">先舊後新 · FIFO</text>
<rect x="914" y="170" width="250" height="64" rx="8" class="store"/><text x="1039" y="197" text-anchor="middle" class="nt">讀取 SQLite 最舊一筆</text><text x="1039" y="216" text-anchor="middle" class="ns">offline_events · created_at</text>
<rect x="520" y="326" width="250" height="64" rx="8" class="node"/><text x="645" y="353" text-anchor="middle" class="nt">POST /api/events</text><text x="645" y="372" text-anchor="middle" class="ns">舊事件優先；佇列清空後才送新事件</text>
<path d="M888 306L998 358L888 410L778 358Z" class="decision"/><text x="888" y="354" text-anchor="middle" class="nt">收到成功 ACK？</text><text x="888" y="373" text-anchor="middle" class="ns">連線與伺服器皆成功</text>
<rect x="1000" y="472" width="220" height="70" rx="8" class="node-accent"/><text x="1110" y="500" text-anchor="middle" class="nt">保留／排入 SQLite</text><text x="1110" y="519" text-anchor="middle" class="ns">不刪除 · 等下次重試</text>
<rect x="520" y="472" width="260" height="70" rx="8" class="store"/><text x="650" y="500" text-anchor="middle" class="nt">後端冪等去重並儲存</text><text x="650" y="519" text-anchor="middle" class="ns">相同 clientEventId 回傳既有事件</text>
<rect x="210" y="472" width="230" height="70" rx="8" class="node"/><text x="325" y="500" text-anchor="middle" class="nt">刪除已 ACK 的精確列</text><text x="325" y="519" text-anchor="middle" class="ns">再取下一筆；不可提前刪除</text>
<rect x="84" y="600" width="220" height="60" rx="30" class="node"/><text x="194" y="627" text-anchor="middle" class="nt">佇列清空／本次完成</text><text x="194" y="646" text-anchor="middle" class="ns">回到即時監控</text>
<path d="M274 202H346" class="arrow" marker-end="url(#arr)"/><path d="M568 202H594" class="arrow" marker-end="url(#arr)"/><path d="M790 218H912" class="arrow queue" marker-end="url(#arrG)"/><text x="844" y="207" class="lab yes">有</text><path d="M1039 234V294H645V324" class="arrow queue" marker-end="url(#arrG)"/><path d="M692 276V302H645V324" class="arrow" marker-end="url(#arr)"/><text x="702" y="294" class="lab">無：送新事件</text><path d="M770 358H776" class="arrow" marker-end="url(#arr)"/><path d="M888 410V438H650V470" class="arrow queue" marker-end="url(#arrG)"/><text x="900" y="434" class="lab yes">是</text><path d="M998 358H1110V470" class="arrow accent" marker-end="url(#arrR)"/><text x="1010" y="346" class="lab no">否</text><path d="M520 507H442" class="arrow queue" marker-end="url(#arrG)"/><path d="M325 472V286H1039V236" class="arrow queue" marker-end="url(#arrG)"/><text x="338" y="300" class="lab yes">還有：取下一筆</text><path d="M325 542V570H194V598" class="arrow" marker-end="url(#arr)"/><text x="335" y="565" class="lab">已清空</text><path d="M1110 542V630H306" class="arrow accent" marker-end="url(#arrR)"/>
<rect x="840" y="588" width="330" height="52" rx="6" class="callout"/><text x="1005" y="610" text-anchor="middle" class="callout-t">重點：傳送失敗不代表事件消失</text><text x="1005" y="628" text-anchor="middle" class="small">下一次 status／辨識事件會再次觸發 drain</text><text x="1226" y="682" text-anchor="end" class="small">依 event_queue.py 與後端 addEvent(clientEventId) 行為繪製</text></svg></main></body></html>

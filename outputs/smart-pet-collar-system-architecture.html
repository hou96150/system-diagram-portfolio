<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧寵物項圈系統架構</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23c64f35'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf6f3;
      --paper-2: #f4ece8;
      --surface: #fffdfb;
      --ink: #2d2826;
      --muted: #6f6662;
      --soft: #928783;
      --rule: #d2c7c1;
      --accent: #c64f35;
      --accent-tint: #f7dfd7;
      --link: #355f83;
      --success: #55765f;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Geist", "Noto Sans TC", ui-sans-serif, sans-serif;
    }
    main { width: min(100%, 1360px, calc((100vh - 48px) * 16 / 9)); }
    figure { margin: 0; }
    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--paper);
    }
    .title { font-family: "Fraunces", "Noto Serif TC", ui-serif, serif; }
    .sans { font-family: "Geist", "Noto Sans TC", ui-sans-serif, sans-serif; }
    .mono { font-family: "Geist Mono", "Noto Sans Mono CJK TC", monospace; }
    .node-name { font-size: 16px; font-weight: 600; fill: var(--ink); }
    .node-sub { font-size: 12px; fill: var(--muted); }
    .tag { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .edge-label { font-size: 12px; font-weight: 500; letter-spacing: .06em; }
    .zone-label { font-size: 8px; font-weight: 600; letter-spacing: .16em; }
    .legend { font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
  </style>
</head>
<body>
  <main>
    <figure>

            <polygon points="0 0, 8 3, 0 6" fill="#c64f35"/>
          </marker>

            <polygon points="0 0, 8 3, 0 6" fill="#355f83"/>
          </marker>

        <rect width="1280" height="720" fill="var(--paper)"/>

        <text x="40" y="28" class="mono" font-size="8" font-weight="600" letter-spacing=".18em" fill="var(--accent)">SMART PET COLLAR · VERIFIED SOFTWARE FLOW</text>

          <rect x="268" y="408" width="64" height="16" rx="2" fill="transparent" stroke="var(--accent)" stroke-width=".8"/>
          <text x="300" y="420" class="mono tag" text-anchor="middle" fill="var(--accent)">TARGET HW</text>

        <text x="64" y="532" class="sans note">邊緣端：非犬聲輸出 unknown／low；高風險需 3 個視窗中至少 2 個為 high arousal + negative valence。</text>
